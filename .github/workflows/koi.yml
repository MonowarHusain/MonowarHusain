name: Draw Koi

on:
  schedule:
    - cron: '5 0 * * *'  # Runs nightly at 00:05 UTC
  workflow_dispatch:      # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: MonowarHusain
          body: asagi        # Options: white, black, asagi, tea, gold, platinum
          output-dir: koi

      - name: Commit updated koi
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add koi/
          git diff --staged --quiet || (git commit -m "chore: update profile koi" && git push)
